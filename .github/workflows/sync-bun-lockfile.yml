name: Synchronize Bun lockfile and verify build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/bun-lockfile-cloudflare-20261030
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate lockfile from package.json
        run: bun install
      - name: Verify frozen lockfile
        run: bun install --frozen-lockfile
      - name: Verify frontend build
        run: bun run build
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "fix(deps): synchronize bun.lock with package.json"
            git push
          fi
